name: Development Release

on:
  push:
    branches:
      - dev

permissions:
  contents: write

concurrency:
  group: development-release
  cancel-in-progress: true

jobs:
  prerelease:
    name: Build and publish development release
    runs-on: ubuntu-24.04

    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1

      - name: Set up Java 21
        uses: actions/setup-java@v6.0.1
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle 9.5.1
        uses: gradle/actions/setup-gradle@v6.3.0
        with:
          gradle-version: "9.5.1"

      - name: Check formatting
        run: gradle spotlessCheck --no-daemon --stacktrace

      - name: Build and test Minecraft 1.21.8
        run: |
          gradle clean build --no-daemon --stacktrace \
            -Pminecraft_version=1.21.8 \
            -Pfabric_api_version=0.136.1+1.21.8 \
            "-Pminecraft_dependency=~1.21.8" \
            "-Pfabric_api_dependency=>=0.136.1" \
            -Parchives_base_name=not-enough-hints-1.21.8
          gradle runProductionClientGameTest --no-daemon --stacktrace \
            -Pminecraft_version=1.21.8 \
            -Pfabric_api_version=0.136.1+1.21.8 \
            "-Pminecraft_dependency=~1.21.8" \
            "-Pfabric_api_dependency=>=0.136.1" \
            -Parchives_base_name=not-enough-hints-1.21.8

      - name: Stage Minecraft 1.21.8 JAR
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          mapfile -t JARS < <(find build/libs -maxdepth 1 -type f -name '*.jar' ! -name '*-sources.jar' ! -name '*-javadoc.jar' ! -name '*-dev.jar' | sort)
          if [[ "${#JARS[@]}" -ne 1 ]]; then
            echo "::error::Expected exactly one Minecraft 1.21.8 JAR, found ${#JARS[@]}."
            exit 1
          fi
          MOD_VERSION="$(sed -n 's/^mod_version=//p' gradle.properties | tr -d '[:space:]')"
          cp "${JARS[0]}" "dist/not-enough-hints-${MOD_VERSION}-fabric-1.21.8.jar"

      - name: Build and test Minecraft 1.21.7
        run: |
          gradle clean build --no-daemon --stacktrace \
            -Pminecraft_version=1.21.7 \
            -Pfabric_api_version=0.129.0+1.21.7 \
            "-Pminecraft_dependency=~1.21.7" \
            "-Pfabric_api_dependency=>=0.129.0" \
            -Parchives_base_name=not-enough-hints-1.21.7
          gradle runProductionClientGameTest --no-daemon --stacktrace \
            -Pminecraft_version=1.21.7 \
            -Pfabric_api_version=0.129.0+1.21.7 \
            "-Pminecraft_dependency=~1.21.7" \
            "-Pfabric_api_dependency=>=0.129.0" \
            -Parchives_base_name=not-enough-hints-1.21.7

      - name: Stage Minecraft 1.21.7 JAR
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t JARS < <(find build/libs -maxdepth 1 -type f -name '*.jar' ! -name '*-sources.jar' ! -name '*-javadoc.jar' ! -name '*-dev.jar' | sort)
          if [[ "${#JARS[@]}" -ne 1 ]]; then
            echo "::error::Expected exactly one Minecraft 1.21.7 JAR, found ${#JARS[@]}."
            exit 1
          fi
          MOD_VERSION="$(sed -n 's/^mod_version=//p' gradle.properties | tr -d '[:space:]')"
          cp "${JARS[0]}" "dist/not-enough-hints-${MOD_VERSION}-fabric-1.21.7.jar"

      - name: Replace development prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          SHORT_SHA="${GITHUB_SHA:0:7}"
          MOD_VERSION="$(sed -n 's/^mod_version=//p' gradle.properties | tr -d '[:space:]')"

          if gh release view dev >/dev/null 2>&1; then
            gh release delete dev --yes --cleanup-tag
          fi

          if gh release view nightly >/dev/null 2>&1; then
            gh release delete nightly --yes --cleanup-tag
          fi

          gh release create nightly \
            "dist/not-enough-hints-${MOD_VERSION}-fabric-1.21.8.jar#Fabric 1.21.8 development JAR" \
            "dist/not-enough-hints-${MOD_VERSION}-fabric-1.21.7.jar#Fabric 1.21.7 development JAR" \
            --target "$GITHUB_SHA" \
            --title "Not Enough Hints nightly $SHORT_SHA" \
            --notes "Automated nightly build from dev at commit $GITHUB_SHA. Both Minecraft targets passed the production client GameTest. This is a prerelease and may contain incomplete features." \
            --prerelease
