name: Development Release

on:
  push:
    branches:
      - dev

permissions:
  contents: write

concurrency:
  group: development-release
  cancel-in-progress: true

jobs:
  prerelease:
    name: Build and publish development release
    runs-on: ubuntu-24.04

    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1

      - name: Set up Java 21
        uses: actions/setup-java@v6.0.1
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle 9.5.1
        uses: gradle/actions/setup-gradle@v6.3.0
        with:
          gradle-version: "9.5.1"

      - name: Check formatting and build
        run: gradle spotlessCheck clean build --no-daemon --stacktrace

      - name: Find development JAR
        id: jar
        shell: bash
        run: |
          set -euo pipefail

          mapfile -t JARS < <(
            find build/libs -maxdepth 1 -type f -name '*.jar'               ! -name '*-sources.jar'               ! -name '*-javadoc.jar'               ! -name '*-dev.jar'               | sort
          )

          if [[ "${#JARS[@]}" -ne 1 ]]; then
            echo "::error::Expected exactly one development JAR, found ${#JARS[@]}."
            printf '%s
' "${JARS[@]}"
            exit 1
          fi

          echo "jar=${JARS[0]}" >> "$GITHUB_OUTPUT"
          echo "short_sha=${GITHUB_SHA:0:7}" >> "$GITHUB_OUTPUT"

      - name: Replace development prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail

          if gh release view dev >/dev/null 2>&1; then
            gh release delete dev --yes --cleanup-tag
          fi

          gh release create dev             "${{ steps.jar.outputs.jar }}#Fabric 1.21.8 development JAR"             --target "$GITHUB_SHA"             --title "Not Enough Hints dev ${{ steps.jar.outputs.short_sha }}"             --notes "Automated development build from `dev` at commit `$GITHUB_SHA`. This is a prerelease and may contain incomplete features."             --prerelease
