name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build:
    name: Build and test
    runs-on: ubuntu-24.04

    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1

      - name: Set up Java 21
        uses: actions/setup-java@v6.0.1
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle 9.5.1
        uses: gradle/actions/setup-gradle@v6.3.0
        with:
          gradle-version: "9.5.1"

      - name: Check formatting and build
        run: gradle spotlessCheck build --no-daemon --stacktrace

      - name: Upload development build
        uses: actions/upload-artifact@v7.0.1
        with:
          name: not-enough-hints-${{ github.sha }}
          path: |
            build/libs/*.jar
            !build/libs/*-sources.jar
            !build/libs/*-javadoc.jar
            !build/libs/*-dev.jar
          if-no-files-found: error
          retention-days: 7
