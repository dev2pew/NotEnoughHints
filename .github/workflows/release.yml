name: Stable Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version, for example 0.1.0"
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: stable-release
  cancel-in-progress: false

jobs:
  release:
    name: Build and publish stable release
    runs-on: ubuntu-24.04

    steps:
      - name: Require main branch
        shell: bash
        run: |
          if [[ "$GITHUB_REF" != "refs/heads/main" ]]; then
            echo "::error::Stable releases must be created from the main branch."
            echo "::error::Selected ref: $GITHUB_REF"
            exit 1
          fi

      - name: Check out repository
        uses: actions/checkout@v7.0.1

      - name: Set up Java 21
        uses: actions/setup-java@v6.0.1
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle 9.5.1
        uses: gradle/actions/setup-gradle@v6.3.0
        with:
          gradle-version: "9.5.1"

      - name: Validate release version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${{ inputs.version }}"

          if [[ ! "$VERSION" =~ ^[0-9]+[.][0-9]+[.][0-9]+$ ]]; then
            echo "::error::Version must use X.Y.Z, for example 0.1.0."
            exit 1
          fi

          PROJECT_VERSION="$(sed -n 's/^mod_version=//p' gradle.properties | tr -d '[:space:]')"
          if [[ -z "$PROJECT_VERSION" ]]; then
            echo "::error::mod_version was not found in gradle.properties."
            exit 1
          fi
          if [[ "$VERSION" != "$PROJECT_VERSION" ]]; then
            echo "::error::Requested version $VERSION does not match mod_version=$PROJECT_VERSION."
            exit 1
          fi

          TAG="v$VERSION"
          if git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null 2>&1; then
            echo "::error::Tag $TAG already exists."
            exit 1
          fi

          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Check formatting
        run: gradle spotlessCheck --no-daemon --stacktrace

      - name: Build and test Minecraft 1.21.8
        run: |
          gradle clean build --no-daemon --stacktrace \
            -Pminecraft_version=1.21.8 \
            -Pfabric_api_version=0.136.1+1.21.8 \
            "-Pminecraft_dependency=~1.21.8" \
            "-Pfabric_api_dependency=>=0.136.1" \
            -Parchives_base_name=not-enough-hints-1.21.8
          gradle runProductionClientGameTest --no-daemon --stacktrace \
            -Pminecraft_version=1.21.8 \
            -Pfabric_api_version=0.136.1+1.21.8 \
            "-Pminecraft_dependency=~1.21.8" \
            "-Pfabric_api_dependency=>=0.136.1" \
            -Parchives_base_name=not-enough-hints-1.21.8

      - name: Stage Minecraft 1.21.8 JAR
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          mapfile -t JARS < <(find build/libs -maxdepth 1 -type f -name '*.jar' ! -name '*-sources.jar' ! -name '*-javadoc.jar' ! -name '*-dev.jar' | sort)
          if [[ "${#JARS[@]}" -ne 1 ]]; then
            echo "::error::Expected exactly one Minecraft 1.21.8 JAR, found ${#JARS[@]}."
            exit 1
          fi
          cp "${JARS[0]}" "dist/not-enough-hints-${{ inputs.version }}-fabric-1.21.8.jar"

      - name: Build and test Minecraft 1.21.7
        run: |
          gradle clean build --no-daemon --stacktrace \
            -Pminecraft_version=1.21.7 \
            -Pfabric_api_version=0.129.0+1.21.7 \
            "-Pminecraft_dependency=~1.21.7" \
            "-Pfabric_api_dependency=>=0.129.0" \
            -Parchives_base_name=not-enough-hints-1.21.7
          gradle runProductionClientGameTest --no-daemon --stacktrace \
            -Pminecraft_version=1.21.7 \
            -Pfabric_api_version=0.129.0+1.21.7 \
            "-Pminecraft_dependency=~1.21.7" \
            "-Pfabric_api_dependency=>=0.129.0" \
            -Parchives_base_name=not-enough-hints-1.21.7

      - name: Stage Minecraft 1.21.7 JAR
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t JARS < <(find build/libs -maxdepth 1 -type f -name '*.jar' ! -name '*-sources.jar' ! -name '*-javadoc.jar' ! -name '*-dev.jar' | sort)
          if [[ "${#JARS[@]}" -ne 1 ]]; then
            echo "::error::Expected exactly one Minecraft 1.21.7 JAR, found ${#JARS[@]}."
            exit 1
          fi
          cp "${JARS[0]}" "dist/not-enough-hints-${{ inputs.version }}-fabric-1.21.7.jar"

      - name: Create stable GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh release create "${{ steps.version.outputs.tag }}" \
            "dist/not-enough-hints-${{ inputs.version }}-fabric-1.21.8.jar#Fabric 1.21.8 mod JAR" \
            "dist/not-enough-hints-${{ inputs.version }}-fabric-1.21.7.jar#Fabric 1.21.7 mod JAR" \
            --target "$GITHUB_SHA" \
            --title "Not Enough Hints ${{ steps.version.outputs.tag }}" \
            --generate-notes \
            --latest
